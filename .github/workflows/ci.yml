name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt runtime libraries (Linux, offscreen GUI test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests (no game files needed)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Self test from source
        env:
          CSTUDIO_HOME: ${{ runner.temp }}/cstudio-home
          QT_QPA_PLATFORM: offscreen
        run: python CrimsonSoundtrackStudio.py --selftest
